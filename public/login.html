<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in — TrackGimex</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="auth-wrap">
    <aside class="auth-side">
      <a class="brand" href="index.html"><span class="logo-mark" data-logo></span>TrackGimex</a>
      <div>
        <p class="eyebrow" id="sideEyebrow">Landlords &amp; agents</p>
        <h2 id="sideTitle">Every property, tenant and shilling — <span class="green">tracked.</span></h2>
      </div>
    </aside>

    <main class="auth-main">
      <div class="auth-card">
        <div class="tabs" role="tablist" id="roleTabs">
          <button type="button" data-role="landlord" class="active">Landlord / Agent</button>
          <button type="button" data-role="tenant">Tenant</button>
        </div>

        <h1 id="title" style="font-size:1.8rem;font-weight:800;margin-bottom:6px">Welcome back</h1>
        <p class="muted" id="subtitle" style="margin-bottom:24px">Log in to manage your properties.</p>

        <form id="loginForm" novalidate>
          <div class="field"><label for="le">Email</label><input id="le" name="email" type="email" autocomplete="email" required></div>
          <div class="field"><label for="lp">Password</label><input id="lp" name="password" type="password" autocomplete="current-password" required></div>
          <button class="btn btn-primary btn-block" type="submit">Log in</button>
          <p class="switch-link" style="margin-top:12px"><button type="button" data-mode="forgot">Forgot password?</button></p>
        </form>

        <form id="registerForm" novalidate hidden>
          <div class="field"><label for="rn">Full name</label><input id="rn" name="name" maxlength="120" autocomplete="name" required></div>
          <div class="field" id="kindField">
            <label for="rk">I am a</label>
            <select id="rk" name="kind"><option>Landlord</option><option>Agent</option><option>Caretaker</option></select>
          </div>
          <div class="field-row">
            <div class="field"><label for="re">Email</label><input id="re" name="email" type="email" autocomplete="email" required></div>
            <div class="field"><label for="rph">Phone</label><input id="rph" name="phone" maxlength="30" placeholder="07XX XXX XXX" autocomplete="tel"></div>
          </div>
          <div class="field"><label for="rp">Password</label><input id="rp" name="password" type="password" minlength="8" autocomplete="new-password" required>
            <p class="hint">At least 8 characters.</p></div>
          <label class="check small" style="margin-bottom:16px"><input type="checkbox" name="agree" required> I agree to the terms of use and privacy policy</label>
          <button class="btn btn-primary btn-block" type="submit">Create account</button>
        </form>

        <form id="forgotForm" novalidate hidden>
          <div class="field"><label for="fe">Email</label><input id="fe" name="email" type="email" autocomplete="email" required></div>
          <button class="btn btn-primary btn-block" type="submit">Send reset link</button>
        </form>

        <form id="recoveryForm" novalidate hidden>
          <div class="field"><label for="np">New password</label><input id="np" name="password" type="password" minlength="8" autocomplete="new-password" required>
            <p class="hint">At least 8 characters.</p></div>
          <button class="btn btn-primary btn-block" type="submit">Save new password</button>
        </form>

        <div id="sentBox" class="alert-box info" hidden></div>
        <p class="switch-link" id="switchLine"></p>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    let role = params.get("role") === "tenant" ? "tenant" : "landlord";
    let mode = ["register", "forgot", "recovery"].includes(params.get("mode")) ? params.get("mode") : "login";
    // only allow redirects to our own pages
    const nextParam = params.get("next") || "";
    const next = /^(landlord|tenant|pay)\.html([?#].*)?$/.test(nextParam) ? nextParam : "";

    function render() {
      UI.$$(".tabs button").forEach(b => b.classList.toggle("active", b.dataset.role === role));
      UI.$("#roleTabs").hidden = mode === "forgot" || mode === "recovery";
      for (const m of ["login", "register", "forgot", "recovery"]) UI.$("#" + m + "Form").hidden = mode !== m;
      UI.$("#sentBox").hidden = true;
      UI.$("#kindField").hidden = role !== "landlord";
      const L = role === "landlord";
      UI.$("#title").textContent = { login: "Welcome back", forgot: "Reset your password", recovery: "Choose a new password",
        register: L ? "Create landlord / agent account" : "Create tenant account" }[mode];
      UI.$("#subtitle").textContent = mode === "forgot" ? "We'll email you a link to set a new password."
        : mode === "recovery" ? "Enter a new password for your account."
        : L ? (mode === "login" ? "Log in to manage your properties." : "Add your buildings and start tracking rent today.")
            : (mode === "login" ? "Log in to pay rent, find a house or give notice." : "Find empty houses, book and pay rent online.");
      UI.$("#sideEyebrow").textContent = L ? "Landlords & agents" : "Tenants";
      UI.$("#sideTitle").innerHTML = L ? 'Every property, tenant and shilling — <span class="green">tracked.</span>'
        : 'Find your next home and pay rent — <span class="green">in minutes.</span>';
      UI.$("#switchLine").innerHTML = mode === "login"
        ? 'New to TrackGimex? <button type="button" data-mode="register">Create an account</button>'
        : mode === "recovery" ? "" : 'Already have an account? <button type="button" data-mode="login">Log in</button>';
    }
    UI.$$(".tabs button").forEach(b => b.onclick = () => { role = b.dataset.role; render(); });
    document.addEventListener("click", e => { const m = e.target.dataset && e.target.dataset.mode; if (m) { mode = m; render(); } });
    const sent = (html) => { UI.$$("form").forEach(f => f.hidden = true); const b = UI.$("#sentBox"); b.innerHTML = html; b.hidden = false; };

    async function busy(form, fn) {
      const btn = form.querySelector("button[type=submit]"); const t = btn.textContent;
      btn.disabled = true; btn.textContent = "Please wait…";
      try { await fn(); } catch (err) { UI.toast(err.message, "err"); }
      finally { btn.disabled = false; btn.textContent = t; }
    }
    const go = u => location.href = next || (u.role === "landlord" ? "landlord.html" : "tenant.html");

    UI.$("#loginForm").onsubmit = e => { e.preventDefault(); const f = new FormData(e.target);
      busy(e.target, async () => go(await Store.login(f.get("email"), f.get("password"), role))); };

    UI.$("#registerForm").onsubmit = e => {
      e.preventDefault();
      const f = Object.fromEntries(new FormData(e.target));
      if (!/^\S+@\S+\.\S+$/.test(f.email)) return UI.toast("Please enter a valid email.", "err");
      if (!e.target.agree.checked) return UI.toast("Please accept the terms to continue.", "err");
      busy(e.target, async () => {
        const r = await Store.register({ ...f, role });
        if (r.needsConfirmation) sent(`<strong>Check your email.</strong> We sent a confirmation link to <strong>${UI.esc(f.email)}</strong>. Click it, then log in here. (Check your spam folder too.)`);
        else go(r.profile);
      });
    };

    UI.$("#forgotForm").onsubmit = e => { e.preventDefault(); const email = new FormData(e.target).get("email");
      busy(e.target, async () => { await Store.resetPassword(email);
        sent(`If an account exists for <strong>${UI.esc(email)}</strong>, we've sent a link to reset the password. Check your inbox and spam folder.`); }); };

    UI.$("#recoveryForm").onsubmit = e => { e.preventDefault(); const pw = new FormData(e.target).get("password");
      if (pw.length < 8) return UI.toast("Password must be at least 8 characters.", "err");
      busy(e.target, async () => { await Store.updatePassword(pw); const p = await Store.init();
        UI.toast("Password updated."); if (p) go(p); else { mode = "login"; render(); } }); };

    // The reset-password email link logs the user in and lands here.
    Store.onAuth((event) => { if (event === "PASSWORD_RECOVERY") { mode = "recovery"; render(); } });
    // Error from an expired/used email link (Supabase puts it in the URL hash)
    const hash = new URLSearchParams(location.hash.slice(1));
    if (hash.get("error_description")) setTimeout(() => UI.toast(hash.get("error_description").replace(/\+/g, " ") + ". Please try again.", "err"), 200);
    render();
  </script>
</body>
</html>
