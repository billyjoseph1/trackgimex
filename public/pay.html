<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Payment — TrackGimex</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container" style="height:76px">
      <a class="brand" href="index.html"><span class="logo-mark sm" data-logo></span>TrackGimex</a>
      <a class="btn btn-ghost btn-sm" href="tenant.html">← Back to dashboard</a>
    </div>
  </header>

  <div class="pay-wrap" id="payRoot"></div>

  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script>
  (() => {
    const S = Store, { esc, $, $$, toast } = UI;
    const me = S.currentUser();
    if (!me || me.role !== "tenant") {
      location.replace("login.html?role=tenant&next=" + encodeURIComponent("pay.html" + location.search));
      return;
    }
    const qs = new URLSearchParams(location.search);
    const u = S.unit(qs.get("unit"));
    const root = $("#payRoot");
    const fail = (msg) => { root.style.display = "block"; root.innerHTML = `<div class="card empty"><h3 style="color:var(--text)">${msg}</h3>
      <a class="btn btn-primary" href="tenant.html#find">Find another house</a></div>`; };
    if (!u) return fail("That house could not be found.");
    const p = S.property(u.propertyId);
    const ll = S.user(p.landlordId);
    const mine = u.tenantId === me.id;
    const myPendingPaid = S.db.requests.some((r) => r.unitId === u.id && r.tenantId === me.id && r.status === "pending" && r.paid);
    if (!mine && u.status !== "vacant") return fail(myPendingPaid ? "You have already booked this house. Wait for the landlord to approve it." : "Sorry, this house is no longer available.");

    // ---- what can be paid ----
    let options;
    if (mine) {
      const r = S.rentStatus(u, S.ym());
      const dep = Math.max(0, u.deposit - S.depositPaid(u));
      options = [{ id: "rent", title: "Pay rent", desc: "Choose the month below. You can pay part of it.", amount: r.balance || u.rent, items: [] }];
      if (dep) options.push({ id: "deposit", title: "Pay deposit balance", desc: "Refundable security deposit", amount: dep });
    } else {
      options = [
        { id: "book", title: "Book this house — pay deposit", desc: "The house is reserved for you while the landlord approves.", amount: u.deposit },
        { id: "bookrent", title: "Deposit + first month's rent", desc: "Move in ready: deposit and " + S.monthLabel(S.ym()) + " rent.", amount: u.deposit + u.rent },
      ];
    }
    const start = qs.get("kind") === "deposit" ? "deposit" : options[0].id;
    let choice = options.find((o) => o.id === start) || options[0];
    let method = "mpesa";
    let rentMonth = S.ym();

    root.innerHTML = `
      <div>
        <div class="alert-box warn small"><strong>Demo payments:</strong> no real money is charged. Connect M-Pesa Daraja / a card gateway to go live (see README).</div>
        <div class="card">
          <h2 style="font-size:1.4rem;margin-bottom:4px">${mine ? "Pay for your house" : "Book &amp; pay"}</h2>
          <p class="muted" style="margin-bottom:18px">House ${esc(u.label)} at ${esc(p.name)}</p>
          <h4 style="margin-bottom:10px">1. What are you paying for?</h4>
          <div class="option-list" id="opts">${options.map((o) => `<label class="option"><input type="radio" name="opt" value="${o.id}" ${o.id === choice.id ? "checked" : ""}>
            <span>${esc(o.title)}<span class="o-desc">${esc(o.desc)}</span></span><span class="o-amt">${S.money(o.amount)}</span></label>`).join("")}</div>
          <div id="rentFields" class="field-row" style="margin-top:16px">
            <div class="field"><label>Month</label><input type="month" id="rentMonth" value="${rentMonth}"></div>
            <div class="field"><label>Amount (Ksh)</label><input type="number" id="rentAmt" min="1"></div>
          </div>
        </div>
        <div class="card">
          <h4 style="margin-bottom:12px">2. How do you want to pay?</h4>
          <div class="method-tabs"><button type="button" data-m="mpesa" class="active">M-Pesa</button><button type="button" data-m="card">Card</button><button type="button" data-m="bank">Bank transfer</button></div>
          <form id="payForm" novalidate></form>
        </div>
      </div>
      <aside class="card" style="position:sticky;top:96px">
        <div class="house-img" style="border-radius:10px;margin-bottom:16px;height:110px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" style="width:48px;height:48px"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg></div>
        <h3>${esc(p.name)} · ${esc(u.label)}</h3>
        <p class="muted small" style="margin-bottom:14px">${esc(u.type)} · ${esc(p.location)}</p>
        <div class="summary-line"><span class="muted">Monthly rent</span><span>${S.money(u.rent)}</span></div>
        <div class="summary-line"><span class="muted">Deposit</span><span>${S.money(u.deposit)}</span></div>
        <div class="summary-line"><span class="muted">Paid to</span><span>${esc(ll?.name)}</span></div>
        <div class="summary-line total"><span>Total</span><span id="total"></span></div>
      </aside>`;

    const amount = () => choice.id === "rent" ? Number($("#rentAmt").value) || 0 : choice.amount;
    const updTotal = () => { $("#total").textContent = S.money(amount()); $$(".pay-btn").forEach((b) => (b.textContent = "Pay " + S.money(amount()))); };
    const updRent = () => {
      $("#rentFields").hidden = choice.id !== "rent";
      if (choice.id === "rent") { const r = S.rentStatus(u, rentMonth); $("#rentAmt").value = r.balance || u.rent; }
      updTotal();
    };
    $$("#opts input").forEach((r) => (r.onchange = () => { choice = options.find((o) => o.id === r.value); updRent(); }));
    $("#rentMonth").onchange = (e) => { rentMonth = e.target.value || S.ym(); updRent(); };
    $("#rentAmt").oninput = updTotal;

    const forms = {
      mpesa: () => `<div class="field"><label>M-Pesa phone number</label><input name="phone" value="${esc(me.phone)}" placeholder="07XX XXX XXX" inputmode="tel"></div>
        <p class="hint" style="margin:-6px 0 16px">You'll get a prompt on your phone to enter your M-Pesa PIN.</p>
        <button class="btn btn-primary btn-block btn-lg pay-btn" type="submit"></button>
        <details style="margin-top:16px" class="muted small"><summary style="cursor:pointer">Prefer Paybill?</summary>
          <p style="margin-top:8px">Paybill <strong>522522</strong>, account <strong>${esc(p.name.slice(0, 6).toUpperCase().replace(/\s/g, ""))}-${esc(u.label)}</strong>. Then switch to “Bank transfer” and enter the M-Pesa code.</p></details>`,
      card: () => `<div class="field"><label>Card number</label><input name="card" placeholder="4242 4242 4242 4242" inputmode="numeric" autocomplete="cc-number"></div>
        <div class="field-row"><div class="field"><label>Expiry (MM/YY)</label><input name="exp" placeholder="12/28" autocomplete="cc-exp"></div>
          <div class="field"><label>CVC</label><input name="cvc" placeholder="123" inputmode="numeric" autocomplete="cc-csc"></div></div>
        <div class="field"><label>Name on card</label><input name="cname" value="${esc(me.name)}" autocomplete="cc-name"></div>
        <button class="btn btn-primary btn-block btn-lg pay-btn" type="submit"></button>`,
      bank: () => `<div class="alert-box info small">Bank: <strong>Equity Bank</strong> · Account name: <strong>${esc(ll?.name)}</strong> · Account no.: <strong>0123 4567 8910</strong> · Reference: <strong>${esc(u.label)}</strong></div>
        <div class="field"><label>Transaction / M-Pesa reference</label><input name="ref" placeholder="e.g. QK12AB34CD"></div>
        <button class="btn btn-primary btn-block btn-lg pay-btn" type="submit"></button>
        <p class="hint" style="margin-top:10px">Your landlord sees this reference and can confirm it against their statement.</p>`,
    };
    const renderForm = () => { $("#payForm").innerHTML = forms[method](); updTotal(); };
    $$(".method-tabs button").forEach((b) => (b.onclick = () => { method = b.dataset.m; $$(".method-tabs button").forEach((x) => x.classList.toggle("active", x === b)); renderForm(); }));

    const luhn = (n) => { let s = 0, alt = false; for (let i = n.length - 1; i >= 0; i--) { let d = +n[i]; if (alt) { d *= 2; if (d > 9) d -= 9; } s += d; alt = !alt; } return s % 10 === 0; };

    $("#payForm").onsubmit = (e) => {
      e.preventDefault();
      const f = Object.fromEntries(new FormData(e.target));
      const amt = amount();
      if (!(amt > 0)) return toast("Enter an amount to pay.", "err");
      let methodName, ref;
      if (method === "mpesa") {
        const ph = S.normPhone(f.phone);
        if (!/^0[17]\d{8}$/.test(ph)) return toast("Enter a valid Safaricom number, e.g. 0712 345 678.", "err");
        methodName = "M-Pesa";
        ref = "S" + Math.random().toString(36).slice(2, 11).toUpperCase();
        stk(ph, amt, () => complete(methodName, ref));
        return;
      }
      if (method === "card") {
        const n = (f.card || "").replace(/\s/g, "");
        if (!/^\d{13,19}$/.test(n) || !luhn(n)) return toast("That card number doesn't look right.", "err");
        if (!/^(0[1-9]|1[0-2])\/\d{2}$/.test(f.exp || "")) return toast("Expiry must be MM/YY.", "err");
        if (!/^\d{3,4}$/.test(f.cvc || "")) return toast("Enter the 3-digit CVC.", "err");
        methodName = "Card"; ref = "•••• " + n.slice(-4);
      } else {
        if (!(f.ref || "").trim()) return toast("Enter the transaction reference.", "err");
        methodName = "Bank"; ref = f.ref.trim().toUpperCase();
      }
      processing("Processing payment…", () => complete(methodName, ref));
    };

    function processing(text, done) {
      UI.modal("Payment", `<div class="stk"><div class="spinner"></div><p>${esc(text)}</p></div>`);
      setTimeout(() => { UI.closeModal(); done(); }, 1800);
    }
    function stk(phone, amt, done) {
      UI.modal("M-Pesa", `<div class="stk"><div class="spinner"></div>
        <p><strong>Check your phone (${esc(phone)})</strong></p>
        <p class="muted">Enter your M-Pesa PIN to pay ${S.money(amt)} to TrackGimex for ${esc(u.label)}.</p>
        <p class="hint" style="margin-top:14px">Demo: this confirms automatically in a few seconds.</p></div>`);
      setTimeout(() => { if ($(".modal-backdrop")) { UI.closeModal(); done(); } }, 3500);
    }

    function complete(methodName, ref) {
      try {
        const made = [];
        const base = { unitId: u.id, tenantId: me.id, method: methodName, ref, recordedBy: me.id };
        if (choice.id === "rent") made.push(S.recordPayment({ ...base, kind: "rent", month: rentMonth, amount: amount() }));
        else if (choice.id === "deposit") made.push(S.recordPayment({ ...base, kind: "deposit", amount: choice.amount }));
        else {
          // booking: check it is still free, reserve, then record the money
          S.requestUnit(me.id, u.id, "Booked and paid online.", true);
          made.push(S.recordPayment({ ...base, kind: "deposit", amount: u.deposit }));
          if (choice.id === "bookrent") made.push(S.recordPayment({ ...base, kind: "rent", month: S.ym(), amount: u.rent }));
        }
        const total = made.reduce((s, x) => s + x.amount, 0);
        root.style.display = "block";
        root.innerHTML = `<div class="card" style="max-width:560px;margin:0 auto;text-align:center;padding:40px 24px">
          <div class="success-ic">✓</div><h2>Payment successful</h2>
          <p class="muted" style="margin:8px 0 20px">${S.money(total)} paid via ${esc(methodName)}${ref ? " · " + esc(ref) : ""}.
          ${mine ? "Your landlord has been notified." : `House ${esc(u.label)} is now <strong>reserved</strong> for you. ${esc(ll?.name)} has been notified and will approve your move-in.`}</p>
          <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
            ${made.map((m) => `<button class="btn btn-outline" data-r="${m.id}">Receipt ${esc(m.receiptNo)}</button>`).join("")}
            <a class="btn btn-primary" href="tenant.html#${mine ? "home" : "requests"}">Go to dashboard</a></div></div>`;
        $$("[data-r]").forEach((b) => (b.onclick = () => UI.receipt(S.db.payments.find((x) => x.id === b.dataset.r))));
      } catch (err) { toast(err.message, "err"); }
    }

    renderForm(); updRent();
  })();
  </script>
</body>
</html>
