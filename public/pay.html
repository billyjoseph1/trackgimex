<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Payment — TrackGimex</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container" style="height:76px">
      <a class="brand" href="index.html"><span class="logo-mark sm" data-logo></span>TrackGimex</a>
      <a class="btn btn-ghost btn-sm" href="tenant.html">← Back to dashboard</a>
    </div>
  </header>

  <div class="pay-wrap" id="payRoot"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js" integrity="sha384-TcHRA3zBbn+Lexh5n+Oil4guNPOS3rjNDpGRAN46u/s/mB2IZ50ceC6TYDU2yvgK" crossorigin="anonymous"></script>
  <script src="js/config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script>
  (async () => {
    const S = Store, { esc, $, $$, toast } = UI;
    const root = $("#payRoot");
    root.style.display = "block";
    root.innerHTML = UI.loading();
    let me;
    try { me = await S.init(); } catch (err) { root.innerHTML = UI.failed(err.message); return; }
    if (!me || me.role !== "tenant") {
      location.replace("login.html?role=tenant&next=" + encodeURIComponent("pay.html" + location.search));
      return;
    }
    const qs = new URLSearchParams(location.search);
    const u = S.unit(qs.get("unit"));
    const fail = (msg) => { root.style.display = "block"; root.innerHTML = `<div class="card empty"><h3 style="color:var(--text)">${msg}</h3>
      <a class="btn btn-primary" href="tenant.html#find">Find another house</a></div>`; };
    if (!u) return fail("That house could not be found, or it is no longer available.");
    const p = S.property(u.propertyId);
    const ll = S.user(p.landlordId) || { name: "the landlord", phone: "", payoutInfo: "" };
    const mine = S.isMine(u.tenantId);
    if (!mine && u.status !== "vacant") return fail("Sorry, this house is no longer available.");
    const myPendingBooking = S.db.requests.some((r) => r.unitId === u.id && S.isMine(r.tenantId) && r.status === "pending" && r.paid);
    if (!mine && myPendingBooking) return fail("You already reported a payment for this house. Wait for the landlord to approve it.");

    // ---- what can be paid ----
    let options;
    if (mine) {
      const r = S.rentStatus(u, S.ym());
      const dep = Math.max(0, u.deposit - S.depositPaid(u));
      options = [{ id: "rent", title: "Pay rent", desc: "Choose the month below. You can pay part of it.", amount: r.balance || u.rent }];
      if (dep) options.push({ id: "deposit", title: "Pay deposit balance", desc: "Refundable security deposit", amount: dep });
    } else {
      options = [
        { id: "deposit", title: "Book this house — pay deposit", desc: "The landlord confirms your payment and approves your move-in.", amount: u.deposit },
        { id: "deposit_rent", title: "Deposit + first month's rent", desc: "Move in ready: deposit and " + S.monthLabel(S.ym()) + " rent.", amount: u.deposit + u.rent },
      ];
    }
    let choice = options.find((o) => o.id === (qs.get("kind") === "deposit" ? "deposit" : "")) || options[0];
    let rentMonth = S.ym();
    const account = (p.name.slice(0, 6).toUpperCase().replace(/[^A-Z0-9]/g, "")) + "-" + u.label;

    root.style.display = "";
    root.innerHTML = `
      <div>
        <div class="card">
          <h2 style="font-size:1.4rem;margin-bottom:4px">${mine ? "Pay for your house" : "Book &amp; pay"}</h2>
          <p class="muted" style="margin-bottom:18px">House ${esc(u.label)} at ${esc(p.name)}</p>
          <h4 style="margin-bottom:10px">1. What are you paying for?</h4>
          <div class="option-list" id="opts">${options.map((o) => `<label class="option"><input type="radio" name="opt" value="${o.id}" ${o.id === choice.id ? "checked" : ""}>
            <span>${esc(o.title)}<span class="o-desc">${esc(o.desc)}</span></span><span class="o-amt">${S.money(o.amount)}</span></label>`).join("")}</div>
          <div id="rentFields" class="field-row" style="margin-top:16px">
            <div class="field"><label>Month</label><input type="month" id="rentMonth" value="${rentMonth}"></div>
            <div class="field"><label>Amount (Ksh)</label><input type="number" id="rentAmt" min="1"></div>
          </div>
        </div>
        ${ll.mpesaReady ? `<div class="card" style="border-color:rgba(25,195,125,.45)">
          <h4 style="margin-bottom:6px">2. Pay with M-Pesa</h4>
          <p class="muted small" style="margin-bottom:14px">You'll get a prompt on your phone. Enter your M-Pesa PIN and you're done — paid straight to ${esc(ll.name)}, confirmed automatically.</p>
          <form id="stkForm" novalidate>
            <div class="field"><label>M-Pesa phone number</label><input name="phone" value="${esc(me.phone)}" placeholder="07XX XXX XXX" inputmode="tel" autocomplete="tel" required></div>
            <button class="btn btn-primary btn-block btn-lg" type="submit" id="stkBtn">Pay <span class="js-amt"></span> with M-Pesa</button>
          </form>
        </div>
        <details class="card" id="manualPay"><summary style="cursor:pointer;font-weight:600">Already paid by Paybill, Till or bank? Enter the code instead</summary>
          <div style="margin-top:16px">` : ""}
        <div class="card">
          <h4 style="margin-bottom:12px">${ll.mpesaReady ? "" : "2. "}Pay ${esc(ll.name)}</h4>
          ${ll.payoutInfo ? `<div class="alert-box info" style="white-space:pre-line"><strong>How to pay:</strong>\n${esc(ll.payoutInfo)}</div>`
            : `<div class="alert-box warn">${esc(ll.name)} hasn't added payment details yet. Call ${ll.phone ? `<a href="tel:${esc(ll.phone)}">${esc(ll.phone)}</a>` : "them"} to ask how to pay.</div>`}
          <p class="muted small">${/^M-Pesa Send Money/.test(ll.payoutInfo) ? "" : `If asked for an account number, use <strong>${esc(account)}</strong>. `}Pay <strong id="payAmt"></strong>, then wait for the confirmation SMS.</p>
        </div>
        <div class="card">
          <h4 style="margin-bottom:12px">${ll.mpesaReady ? "" : "3. "}Enter the confirmation code</h4>
          <form id="payForm" novalidate>
            <div class="field-row">
              <div class="field"><label>Paid with</label><select name="method"><option>M-Pesa</option><option>Bank</option></select></div>
              <div class="field"><label>M-Pesa / bank reference</label><input name="ref" placeholder="e.g. TKA1B2C3D4" maxlength="60" autocomplete="off" style="text-transform:uppercase" required></div>
            </div>
            <p class="hint" style="margin:-6px 0 16px">It's in your M-Pesa SMS (10 letters and numbers). Your landlord checks it before confirming.</p>
            <button class="btn btn-primary btn-block btn-lg" type="submit" id="payBtn">I have paid — send to landlord</button>
          </form>
        </div>
        ${ll.mpesaReady ? `</div></details>` : ""}
      </div>
      <aside class="card" style="position:sticky;top:96px">
        <div class="house-img" style="border-radius:10px;margin-bottom:16px;height:110px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" style="width:48px;height:48px"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg></div>
        <h3>${esc(p.name)} · ${esc(u.label)}</h3>
        <p class="muted small" style="margin-bottom:14px">${esc(u.type)} · ${esc(p.location)}</p>
        <div class="summary-line"><span class="muted">Monthly rent</span><span>${S.money(u.rent)}</span></div>
        <div class="summary-line"><span class="muted">Deposit</span><span>${S.money(u.deposit)}</span></div>
        <div class="summary-line"><span class="muted">Paid to</span><span>${esc(ll.name)}</span></div>
        <div class="summary-line total"><span>Total</span><span id="total"></span></div>
      </aside>`;

    const amount = () => choice.id === "rent" ? Math.round(Number($("#rentAmt").value) || 0) : choice.amount;
    const updTotal = () => { $("#total").textContent = S.money(amount()); $("#payAmt").textContent = S.money(amount()); $$(".js-amt").forEach((x) => (x.textContent = S.money(amount()))); };
    const updRent = () => {
      $("#rentFields").hidden = choice.id !== "rent";
      if (choice.id === "rent") { const r = S.rentStatus(u, rentMonth); $("#rentAmt").value = r.balance || u.rent; }
      updTotal();
    };
    $$("#opts input").forEach((r) => (r.onchange = () => { choice = options.find((o) => o.id === r.value); updRent(); }));
    $("#rentMonth").onchange = (e) => { rentMonth = e.target.value || S.ym(); updRent(); };
    $("#rentAmt").oninput = updTotal;


    // ---------- M-Pesa prompt (STK push) ----------
    const success = (receipt, total) => {
      root.style.display = "block";
      root.innerHTML = `<div class="card" style="max-width:560px;margin:0 auto;text-align:center;padding:40px 24px">
        <div class="success-ic">✓</div><h2>Payment received</h2>
        <p class="muted" style="margin:8px 0 20px">${S.money(total)} paid by M-Pesa${receipt ? " · receipt <strong>" + esc(receipt) + "</strong>" : ""}.
        ${mine ? "Your landlord has been notified and your receipt is ready." : `House ${esc(u.label)} is now <strong>reserved</strong> for you. ${esc(ll.name)} has been notified and will approve your move-in.`}</p>
        <a class="btn btn-primary" href="tenant.html#${mine ? "payments" : "requests"}">Go to dashboard</a></div>`;
    };
    if ($("#stkForm")) $("#stkForm").onsubmit = async (e) => {
      e.preventDefault();
      const phone = new FormData(e.target).get("phone");
      const total = amount();
      if (!(total > 0)) return toast("Enter an amount to pay.", "err");
      const btn = $("#stkBtn"); btn.disabled = true; btn.textContent = "Sending prompt…";
      let started;
      try {
        started = await S.stkPay({ unitId: u.id, kind: choice.id, month: rentMonth, amount: mine ? total : null, phone });
      } catch (err) { toast(err.message, "err"); btn.disabled = false; btn.innerHTML = `Pay <span class="js-amt">${S.money(total)}</span> with M-Pesa`; return; }
      UI.modal("Check your phone", `<div class="stk"><div class="spinner"></div>
        <p><strong>Enter your M-Pesa PIN on your phone</strong></p>
        <p class="muted">to pay ${S.money(started.amount)} to ${esc(ll.name)}. Keep this page open.</p>
        <p class="hint" id="stkMsg" style="margin-top:14px">Waiting for M-Pesa…</p></div>`);
      const r = await S.waitForStk(started.id, { isOpen: () => !!$(".modal-backdrop"),
        onTick: (sec) => { const m = $("#stkMsg"); if (m && sec > 30) m.textContent = "Still waiting… If you didn't get a prompt, close this and try again."; } });
      UI.closeModal();
      if (r.status === "paid") { await S.refresh().catch(() => {}); success(r.receipt, r.amount); return; }
      if (r.status === "cancelled") toast("You cancelled the M-Pesa prompt. Nothing was paid.", "err");
      else if (r.status === "failed") toast("M-Pesa payment failed: " + (r.message || "please try again."), "err");
      else if (r.status === "timeout") toast("We haven't heard back from M-Pesa yet. If money left your account, it will show in Payments shortly.", "err");
      btn.disabled = false; btn.innerHTML = `Pay <span class="js-amt">${S.money(amount())}</span> with M-Pesa`;
    };
    $("#payForm").onsubmit = async (e) => {
      e.preventDefault();
      const f = Object.fromEntries(new FormData(e.target));
      const ref = (f.ref || "").trim().toUpperCase().replace(/\s+/g, "");
      if (!(amount() > 0)) return toast("Enter an amount to pay.", "err");
      if (f.method === "M-Pesa" && !/^[A-Z0-9]{8,12}$/.test(ref)) return toast("An M-Pesa code is 10 letters and numbers, e.g. TKA1B2C3D4.", "err");
      if (ref.length < 4) return toast("Enter the transaction reference.", "err");
      const btn = $("#payBtn"); btn.disabled = true; btn.textContent = "Sending…";
      try {
        const made = [];
        if (mine) made.push(await S.reportPayment({ unitId: u.id, kind: choice.id, month: rentMonth, amount: amount(), method: f.method, ref }));
        else await S.requestUnit(u.id, "Booked and paid via " + f.method + ".", choice.id, f.method, ref);
        root.style.display = "block";
        root.innerHTML = `<div class="card" style="max-width:560px;margin:0 auto;text-align:center;padding:40px 24px">
          <div class="success-ic">✓</div><h2>Sent to your landlord</h2>
          <p class="muted" style="margin:8px 0 20px">We told ${esc(ll.name)} you paid ${S.money(amount())} (${esc(f.method)} ${esc(ref)}).
          ${mine ? "Once they confirm it, your official receipt will appear in Payments." : `Once they confirm the payment and approve, house ${esc(u.label)} is yours.`}</p>
          <a class="btn btn-primary" href="tenant.html#${mine ? "payments" : "requests"}">Go to dashboard</a></div>`;
      } catch (err) { toast(err.message, "err"); btn.disabled = false; btn.textContent = "I have paid — send to landlord"; }
    };
    updRent();
  })();
  </script>
</body>
</html>
